<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin Tức Kindle v6</title>
  <style>
    body { font-family: Georgia, serif; max-width: 680px; margin: 0 auto; padding: 14px; line-height: 1.7; color: #000; background: #fff; font-size: 19px; }
    h1 { font-size: 22px; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 12px; }
    h2 { font-size: 23px; line-height: 1.35; margin-top: 10px; }
    .nav { margin-bottom: 16px; border-bottom: 1px solid #000; padding-bottom: 10px; }
    .nav button { background: #fff; color: #000; border: 1px solid #000; padding: 6px 10px; margin: 3px 4px 3px 0; font-size: 15px; font-weight: bold; }
    .nav button.active { background: #000; color: #fff; }
    .item { border-bottom: 1px solid #ccc; padding: 12px 0; }
    .item a { color: #000; text-decoration: none; font-weight: bold; font-size: 19px; display: block; }
    .desc { font-size: 15px; color: #222; margin-top: 5px; }
    #reader { display: none; }
    #art-body p { margin-bottom: 15px; }
    .back-btn { background: #000; color: #fff; border: none; padding: 8px 14px; font-size: 16px; margin-bottom: 14px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="list-view">
    <h1>TIN TỨC TỐI GIẢN</h1>
    <div class="nav" id="nav"></div>
    <div id="feed">Đang tải tin tức...</div>
  </div>

  <div id="reader">
    <button class="back-btn" onclick="closeArticle()">← Quay lại danh sách</button>
    <h2 id="art-title"></h2>
    <div id="art-body"></div>
    <br><button class="back-btn" onclick="closeArticle()">← Quay lại danh sách</button>
  </div>

  <script>
    const FEEDS = [
      { name: "VnExpress", url: "https://vnexpress.net/rss/tin-moi-nhat.rss" },
      { name: "Tuổi Trẻ", url: "https://tuoitre.vn/rss/tin-moi-nhat.rss" },
      { name: "Thanh Niên", url: "https://thanhnien.vn/rss/home.rss" },
      { name: "Vietstock", url: "https://vietstock.vn/830/chung-khoan/co-phieu.rss" },
      { name: "CafeF", url: "https://cafef.vn/thi-truong-chung-khoan.rss" },
      { name: "Tinh Tế", url: "https://tinhte.vn/rss" }
    ];

    let articles = [];
    const navEl = document.getElementById("nav");
    const feedEl = document.getElementById("feed");

    FEEDS.forEach((f, idx) => {
      const btn = document.createElement("button");
      btn.textContent = f.name;
      btn.onclick = () => loadFeed(idx);
      navEl.appendChild(btn);
    });

    async function loadFeed(index) {
      document.querySelectorAll(".nav button").forEach((b, i) => b.classList.toggle("active", i === index));
      feedEl.innerHTML = "Đang tải danh sách tin...";
      try {
        const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(FEEDS[index].url);
        const res = await fetch(api);
        const data = await res.json();
        articles = data.items || [];
        feedEl.innerHTML = articles.map((item, i) => {
          const cleanDesc = item.description.replace(/<[^>]*>?/gm, '').trim();
          return `<div class="item">
            <a href="javascript:void(0)" onclick="openArticle(${i})">${item.title}</a>
            <div class="desc">${cleanDesc}</div>
          </div>`;
        }).join("");
      } catch (e) {
        feedEl.innerHTML = "Không tải được tin. Kiểm tra lại Wi-Fi.";
      }
    }

    // Lớp 1: Trích xuất qua Jina Reader
    async function fetchViaJina(url, title) {
      const res = await fetch("https://r.jina.ai/" + url);
      if (!res.ok) throw new Error("Jina blocked");
      let text = await res.text();
      if (text.includes("Just a moment") || text.includes("Attention Required")) throw new Error("Cloudflare");

      const shortTitle = title.substring(0, 22);
      const mdStart = text.indexOf("Markdown Content:");
      const titlePos = text.indexOf(shortTitle, mdStart !== -1 ? mdStart : 0);
      if (titlePos !== -1) text = text.substring(titlePos + title.length);

      return text.split("\n")
        .map(l => l.trim())
        .filter(l => l.length > 50 && !l.startsWith("*") && !l.startsWith("-") && !l.startsWith("#") && !l.startsWith("![") && !l.startsWith("[") && !l.includes("javascript:") && !l.includes("Bản quyền") && !l.includes("Tổng biên tập") && !l.includes("Tòa soạn") && !l.includes("FILI"))
        .map(l => l.replace(/\[([^\]]+)\]\([^\)]+\)/g, "$1"));
    }

    // Lớp 2: Bóc tách HTML qua Proxy (hỗ trợ Thanh Niên, Vietstock, CafeF)
    async function fetchViaProxy(url) {
      const res = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
      if (!res.ok) throw new Error("Proxy failed");
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");

      // Bộ chọn vùng nội dung chuẩn cho Thanh Niên, Vietstock (#vst_detail), CafeF (.detail-content, .contentdetail)
      const container = doc.querySelector("#vst_detail, .contentdetail, .detail-content, .detail-cmain, .detail__content, article.fck_detail, .article-body, article") || doc.body;
      const sapo = doc.querySelector(".detail-sapo, .sapo, .pHead")?.textContent.trim();
      const paras = Array.from(container.querySelectorAll("p"))
        .map(p => p.textContent.trim())
        .filter(t => t.length > 40 && !t.includes("©") && !t.includes("Bản quyền") && !t.includes("Giấy phép") && !t.includes("FILI"));

      if (sapo && (!paras[0] || !paras[0].includes(sapo.substring(0, 20)))) {
        paras.unshift(sapo);
      }
      return paras;
    }

    async function openArticle(i) {
      const item = articles[i];
      const bodyEl = document.getElementById("art-body");
      document.getElementById("art-title").textContent = item.title;
      bodyEl.innerHTML = "<p><em>Đang tải toàn bộ bài báo...</em></p>";
      document.getElementById("list-view").style.display = "none";
      document.getElementById("reader").style.display = "block";
      window.scrollTo(0, 0);

      try {
        let lines = [];
        // Ưu tiên Lớp 2 cho các trang có tường lửa/cấu trúc đặc thù
        if (item.link.includes("thanhnien.vn") || item.link.includes("vietstock.vn") || item.link.includes("cafef.vn")) {
          lines = await fetchViaProxy(item.link);
          if (!lines || lines.length === 0) {
            lines = await fetchViaJina(item.link, item.title);
          }
        } else {
          try {
            lines = await fetchViaJina(item.link, item.title);
          } catch (e) {
            lines = await fetchViaProxy(item.link);
          }
        }

        if (lines && lines.length > 0) {
          bodyEl.innerHTML = lines.map(p => `<p>${p}</p>`).join("");
        } else {
          throw new Error("Không trích xuất được chữ");
        }
      } catch (err) {
        const cleanDesc = item.description.replace(/<[^>]*>?/gm, '').trim();
        bodyEl.innerHTML = `<p>${cleanDesc}</p><p><a href="${item.link}">[Mở bài gốc]</a></p>`;
      }
    }

    function closeArticle() {
      document.getElementById("reader").style.display = "none";
      document.getElementById("list-view").style.display = "block";
    }

    loadFeed(0);
  </script>
</body>
</html>
